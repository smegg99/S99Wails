# i18n/locales/pl/webbench.yaml

short:
  value: "Mierzy stronę w WebKitGTK i porównuje ścieżki renderowania"
long:
  value: "s99webbench wczytuje stronę w oknie WebKitGTK i podaje czasy wczytywania, klatek i stylów. --matrix uruchamia osobny proces dla każdej ścieżki renderowania i porównuje wyniki. Wymaga cgo, gtk3, webkit2gtk-4.1 i ekranu."
flagUrl:
  value: "adres URL do zmierzenia"
flagDir:
  value: "katalog zbudowanej aplikacji SPA, serwowany lokalnie i mierzony"
flagWorkload:
  value: "page (treść samej strony) lub synthetic (najpierw buduje listę)"
flagFrames:
  value: "jak długo liczyć klatki"
flagWidth:
  value: "szerokość okna"
flagHeight:
  value: "wysokość okna"
flagGpu:
  value: "akceleracja sprzętowa: always, ondemand, never"
flagMatrix:
  value: "uruchamia domyślne porównanie ścieżek renderowania, osobny proces na konfigurację"
flagJson:
  value: "wypisuje wyniki jako JSON"
flagConsole:
  value: "kopiuje konsolę strony na stdout"
errTarget:
  value: "wymagana jest flaga --url albo --dir"
errGpu:
  value: "--gpu przyjmuje always, ondemand albo never, a nie {value}"
